name: Rust

on:
  push:
    branches:
      - main
      - egui_mod
  pull_request:
    branches:
      - main
      - egui_mod

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential
          # Install Build-Depends from debian/control
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb1-dev

    - name: Clean the project
      run: cargo clean 

    - name: Run tests
      run: cargo test

    - name: Build Debian package
      run: |
          dpkg-buildpackage -b -uc -us
          mkdir artifacts
          cp ../lapsphere_*.deb artifacts/

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: lapsphere-ubuntu-24.04-deb
        path: artifacts/*.deb
        retention-days: 90
