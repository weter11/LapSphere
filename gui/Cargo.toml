[package]
name = "lapsphere"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core egui
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true, features = ["svg", "image"] }
egui_plot.workspace = true

# Your existing dependencies
lapsphere-common.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
ureq = { version = "2.12", default-features = false, features = ["json", "gzip", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
webbrowser.workspace = true

# Async for DBus
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
zbus.workspace = true

# Replace glibc malloc with mimalloc: glibc's per-thread arena pool retains
# freed-but-unused memory (up to 64 MB per arena, one per malloc-thread) and
# never returns it to the OS. Under the GUI's ~8k alloc/s D-Bus polling load
# that arena ratchet accumulated ~8 GB of resident-but-free heap over hours
# (see heaptrack probe: real Rust heap stayed at 27 MB peak / 22 MB leaked
# while RSS grew to 3.6 GB). mimalloc bounds arenas and reuses freed blocks.
#
# mimalloc is NOT retention-free out of the box: it reserves 1 GiB arenas
# (mi_option_arena_reserve), commits them eagerly on Linux
# (arena_eager_commit = 2) and lets THP back them, so with a ~27 MB live heap
# the reservation still shows up as resident [anon:mimalloc]. Three options
# bound it, and they are applied IN-PROCESS at startup by
# `mimalloc_tuning::apply()` in src/main.rs — no .desktop Exec/env wrapper and
# no packaging sed involved, so every launch path (menu, autostart, terminal,
# tray) behaves the same:
#   arena_eager_commit = 0  don't commit reserved arena space up front
#   allow_thp          = 0  stop THP backing the arenas (~2 MB RSS granularity)
#   purge_delay        = 0  decommit freed pages immediately (default 1000 ms)
# Measured on the installed v3.3.2 build (5 min per arm, --tray, identical
# D-Bus workload, /proc sampling): mimalloc-map RSS 57.6 MB -> 12.8 MB and
# VmRSS 160.8 MB -> 115.9 MB; AnonHugePages 51.2 MB -> 0. Per-knob runs showed
# `purge_delay` alone barely moves RSS (155.4 MB) while either structural knob
# alone captures almost all of it (allow_thp 116.2 MB, arena_eager_commit
# 118.0 MB), which is why all three are set rather than the "obvious" one.
#
# The crate exposes no option API of its own (its "extended" feature adds only
# version()/usable_size()/stats_json()), so the options are reached through a
# small `extern "C"` block against mi_option_set/mi_option_get, which the linked
# static mimalloc library exports. The mimalloc Rust crate pulls in the bundled
# C library (static linkage) via its default features.
mimalloc = { version = "0.1", default-features = true }

# Time handling
chrono.workspace = true
ksni = { version = "0.3.3", features = ["blocking"] }

# System statistics
systemstat.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
